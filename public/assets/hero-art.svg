<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Weather scene artwork">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D4ED8"/>
      <stop offset="0.6" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#7DD3FC"/>
    </linearGradient>
    <linearGradient id="mountainBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="mountainFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E40AF"/>
      <stop offset="1" stop-color="#0B1120"/>
    </linearGradient>
  </defs>

  <circle cx="100" cy="100" r="100" fill="url(#sky)"/>

  <!-- sun -->
  <g stroke="#FDE68A" stroke-width="5" stroke-linecap="round" opacity="0.95">
    <line x1="58" y1="18" x2="58" y2="30"/>
    <line x1="76" y1="26" x2="68" y2="34"/>
    <line x1="90" y1="40" x2="82" y2="48"/>
    <line x1="40" y1="26" x2="48" y2="34"/>
    <line x1="26" y1="40" x2="34" y2="48"/>
  </g>
  <circle cx="58" cy="52" r="22" fill="#FDE68A"/>
  <circle cx="58" cy="52" r="27" fill="#FDE68A" opacity="0.25"/>

  <!-- back cloud -->
  <g fill="#BAE6FD" opacity="0.85">
    <circle cx="128" cy="64" r="14"/>
    <circle cx="148" cy="56" r="18"/>
    <circle cx="166" cy="66" r="12"/>
    <rect x="114" y="62" width="64" height="14" rx="7"/>
  </g>

  <!-- mountains -->
  <path d="M0 168 L52 108 L84 142 L118 102 L152 140 L200 108 L200 200 L0 200 Z" fill="url(#mountainBack)"/>
  <path d="M0 200 L0 178 L46 146 L78 172 L112 144 L146 172 L178 152 L200 166 L200 200 Z" fill="url(#mountainFront)"/>

  <!-- front cloud -->
  <g fill="#FFFFFF">
    <circle cx="62" cy="118" r="16"/>
    <circle cx="86" cy="106" r="22"/>
    <circle cx="110" cy="120" r="15"/>
    <rect x="46" y="116" width="80" height="18" rx="9"/>
  </g>

  <!-- raindrops -->
  <g stroke="#7DD3FC" stroke-width="4" stroke-linecap="round">
    <line x1="70" y1="146" x2="66" y2="158"/>
    <line x1="90" y1="148" x2="86" y2="160"/>
    <line x1="110" y1="146" x2="106" y2="158"/>
  </g>
</svg>
