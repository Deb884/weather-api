  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <!-- sun -->
  <g stroke="#FDE68A" stroke-width="3" stroke-linecap="round">
    <line x1="42" y1="6" x2="42" y2="11"/>
    <line x1="52" y1="11" x2="49" y2="14"/>
    <line x1="57" y1="21" x2="52" y2="21"/>
    <line x1="52" y1="31" x2="49" y2="28"/>
    <line x1="42" y1="36" x2="42" y2="31"/>
    <line x1="32" y1="31" x2="35" y2="28"/>
    <line x1="27" y1="21" x2="32" y2="21"/>
    <line x1="32" y1="11" x2="35" y2="14"/>
  </g>
  <circle cx="42" cy="21" r="9" fill="#FDE68A"/>
  <!-- cloud -->
  <g fill="#FFFFFF">
    <circle cx="24" cy="38" r="7"/>
    <circle cx="33" cy="32" r="9"/>
    <circle cx="43" cy="38" r="6"/>
